<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2K27 — Festival gaming</title>
<meta name="description" content="2K27, le festival gaming de l'association Gaming Interco 2K27. La prochaine édition arrive bientôt.">
<meta name="theme-color" content="#0a0a14">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230a0a14'/><rect x='2' y='2' width='60' height='60' rx='12' fill='none' stroke='%2322e8ff' stroke-width='3'/><text x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-weight='900' font-size='24' fill='%2322e8ff' text-anchor='middle'>2K</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap');
  :root{ --bg:#0a0a14; --neon-purple:#b026ff; --neon-cyan:#22e8ff; --neon-pink:#ff2e88; --text:#e8e8f5; --text-dim:#9494b0; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 6%;
    background: radial-gradient(circle at 15% 20%, rgba(176,38,255,0.18), transparent 45%), radial-gradient(circle at 85% 80%, rgba(34,232,255,0.14), transparent 45%), var(--bg);
    color:var(--text); font-family:'Rajdhani', sans-serif; font-size:19px; line-height:1.5;
  }
  .etiquette{ font-family:'Orbitron', sans-serif; font-size:0.85rem; letter-spacing:5px; text-transform:uppercase; color:var(--neon-pink); }
  h1{
    font-family:'Orbitron', sans-serif; font-size:clamp(4rem, 20vw, 8rem); line-height:1.05; font-weight:900; letter-spacing:4px;
    background:linear-gradient(90deg, var(--neon-purple), var(--neon-cyan), var(--neon-pink)); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 30px rgba(176,38,255,0.35));
  }
  h2{ font-family:'Orbitron', sans-serif; font-size:clamp(1.1rem, 4vw, 1.6rem); margin-top:6px; }
  p{ color:var(--text-dim); margin:16px 0 0; max-width:520px; }
</style>
</head>
<body>
  <div class="etiquette">Festival gaming</div>
  <h1>2K27</h1>
  <h2>La prochaine édition arrive bientôt</h2>
  <p>Toutes les infos seront publiées ici dès qu'elles seront prêtes.</p>
  <script src="acces-equipe.js" defer></script>
</body>
</html>
