<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600&display=swap');

  :root{
    --bg: #0a0a14;
    --bg-alt: #10101c;
    --neon-purple: #b026ff;
    --neon-cyan: #22e8ff;
    --neon-pink: #ff2e88;
    --text: #e8e8f5;
    --text-dim: #9494b0;
    --border: rgba(255,255,255,0.1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;

    background: var(--bg);

    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
  }

  h1{
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(3rem, 14vw, 6rem);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p{
    color: var(--text-dim);
    margin: 18px 0 32px;
    max-width: 480px;
  }

  a.btn{
    display: inline-block;
    padding: 14px 34px;
    border-radius: 30px;
    background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
    color: #06060c;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
